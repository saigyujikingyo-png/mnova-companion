name: Portable checks
on: [push, pull_request]
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests scripts mnova_adapter
      - run: uv run ruff format --check src tests scripts mnova_adapter
      - run: uv run pytest -q
      - run: uv run python scripts/check_contracts.py
      - run: uv run python scripts/smoke_mcp.py
      - run: uv run python scripts/check_release.py
